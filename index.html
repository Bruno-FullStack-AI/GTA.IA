<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1030">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
    <link rel="preload" as="image" href="img/lucia.png">
    <link rel="preload" as="image" href="img/jason.png">
    <link rel="preload" as="image" href="img/cj.png">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap"
        rel="stylesheet">
    <title>GTA IA</title>
</head>

<body>
    <p class="nome" id="nome" aria-live="polite" aria-atomic="true">Lucia</p>

    <img class="personagem" id="personagem" src="img/lucia.png" alt="Lucia">

    <!-- ações da foto: tentar de novo (se a IA falhar) e baixar o personagem gerado -->
    <div class="acoes">
        <button class="acao" id="btn-tentar" hidden>🔄 Tentar de novo</button>
        <button class="acao" id="btn-baixar" hidden>⬇️ Baixar personagem</button>
    </div>

    <!-- Mensagem de status durante o loading -->
    <div class="loading-status" id="loading-status" hidden>
        <p>✨ Transformando sua foto em personagem GTA...</p>
    </div>

    <div class="textos">
        <p class="etiqueta">Selecione o seu Personagem</p>
        <h1>Não é só <br>um Jogo</h1>
        <p class="texto-apoio">Escolha uma lenda de Dev City. Ou tire uma selfie e vire uma.</p>
    </div>

    <div class="menu">
        <img class="avatar ativo" role="button" tabindex="0" aria-pressed="true" src="img/lucia.png"
            data-nome="Lucia" data-cor="#ff3cac" alt="Lucia">
        <img class="avatar" role="button" tabindex="0" aria-pressed="false" src="img/jason.png" data-nome="Jason"
            data-cor="#00b2c9" alt="Jason">
        <img class="avatar" role="button" tabindex="0" aria-pressed="false" src="img/cj.png" data-nome="CJ"
            data-cor="#7ed37e" alt="CJ">
        <button class="voce" id="btn-foto" aria-label="Enviar minha foto" aria-haspopup="dialog">📸</button>
    </div>

    <!-- escolha: galeria ou câmera -->
    <div class="modal" id="modal" hidden>
        <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <p class="modal-titulo" id="modal-titulo">Sua foto</p>
            <button class="modal-btn" id="opcao-galeria">🖼️ Galeria</button>
            <button class="modal-btn" id="opcao-camera">📷 Câmera</button>
            <button class="modal-fechar" id="modal-fechar">Cancelar</button>
        </div>
    </div>

    <!-- galeria (no celular, com capture abre a câmera) -->
    <input type="file" id="input-galeria" accept="image/*" hidden>

    <!-- câmera ao vivo -->
    <div class="modal" id="modal-camera" hidden>
        <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="camera-titulo">
            <p class="modal-titulo" id="camera-titulo">Câmera</p>
            <video id="video" autoplay playsinline muted></video>
            <button class="modal-btn" id="tirar-foto">📸 Tirar foto</button>
            <button class="modal-fechar" id="camera-fechar">Cancelar</button>
        </div>
    </div>

    <!-- avisos e erros na tela (em vez de alert()) -->
    <div class="toast" id="toast" role="alert" hidden></div>

    <noscript>
        <p class="sem-js">Este site precisa de JavaScript ativado para funcionar.</p>
    </noscript>

    <!-- Puter.js: dá acesso à IA geradora de imagem (precisa vir ANTES do scripts.js) -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="scripts.js"></script>
</body>

</html>

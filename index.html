<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>GTA IA</title>
</head>

<body>
    <p class="nome" id="nome">Lucia</p>

    <img class="personagem" id="personagem" src="img/lucia.png" alt="Lucia">

    <!-- Mensagem de status durante o loading -->
    <div class="loading-status" id="loading-status" hidden>
        <p>✨ Transformando sua foto em personagem GTA...</p>
    </div>

    <div class="textos">
        <p class="etiqueta">Selecione o seu Personagem</p>
        <h1>Não é só <br>um Jogo</h1>
        <p class="texto-apoio">Escolha uma lenda de Dev City. Ou tire uma selfie e vire uma.</p>
    </div>

    <div class="menu">
        <img class="avatar ativo" src="img/lucia.png" data-nome="Lucia" data-cor="#ff3cac" alt="Lucia">
        <img class="avatar" src="img/jason.png" data-nome="Jason" data-cor="#00b2c9" alt="Jason">
        <img class="avatar" src="img/cj.png" data-nome="CJ" data-cor="#7ed37e" alt="CJ">
        <button class="voce" id="btn-foto" aria-label="Enviar minha foto">📸</button>
    </div>

    <!-- escolha: galeria ou câmera -->
    <div class="modal" id="modal" hidden>
        <div class="modal-caixa">
            <p class="modal-titulo">Sua foto</p>
            <button class="modal-btn" id="opcao-galeria">🖼️ Galeria</button>
            <button class="modal-btn" id="opcao-camera">📷 Câmera</button>
            <button class="modal-fechar" id="modal-fechar">Cancelar</button>
        </div>
    </div>

    <!-- galeria (no celular, com capture abre a câmera) -->
    <input type="file" id="input-galeria" accept="image/*" hidden>

    <!-- câmera ao vivo -->
    <div class="modal" id="modal-camera" hidden>
        <div class="modal-caixa">
            <video id="video" autoplay playsinline muted></video>
            <button class="modal-btn" id="tirar-foto">📸 Tirar foto</button>
            <button class="modal-fechar" id="camera-fechar">Cancelar</button>
        </div>
    </div>

    <!-- Puter.js: dá acesso à IA geradora de imagem (precisa vir ANTES do scripts.js) -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="scripts.js"></script>
</body>

</html>
